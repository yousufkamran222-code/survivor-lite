name: Android build

# Builds an installable test APK (Gradle build, so the AdMob plugin and its
# test ads are included; developer tools stay on). Run it from the Actions tab ("Run workflow") before
# any session where you judge feel/performance, and on every milestone tag (v*).
#
# Signing: if the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS secrets exist, a signed RELEASE apk is built. Otherwise a
# DEBUG apk is built with a throwaway debug key (fine for sideloading tests).
# See docs/SETUP.md for creating the keystore and secrets.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Tests
        run: godot --headless --path . -s res://tests/run_tests.gd

      - uses: ./.github/actions/android-gradle

      - name: Stamp version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          echo "{\"sha\": \"${GITHUB_SHA::7}\", \"run\": ${GITHUB_RUN_NUMBER}, \"built\": \"$(date -u +%Y-%m-%dT%H:%MZ)\"}" > data/build_info.json

      - name: Export APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p build/android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASS"
            godot --headless --path . --export-release "Android" build/android/petri-panic.apk
          else
            echo "::warning::No signing secrets set; building a DEBUG apk."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
            godot --headless --path . --export-debug "Android" build/android/petri-panic.apk
          fi
          ls -la build/android
          test -s build/android/petri-panic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: petri-panic-apk-${{ github.run_number }}
          path: build/android/petri-panic.apk
          retention-days: 30
