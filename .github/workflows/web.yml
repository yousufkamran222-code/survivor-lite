name: Web playtest build

# Exports the browser build and uploads it to itch.io (light213/petri, channel
# "html5") with butler, so the game can be playtested on a phone. DEV TOOL
# ONLY: ads, haptics, real performance and Android lifecycle must be checked
# on the APK.
#
# Normally the Claude cloud session exports and pushes directly after each
# change (see docs/SESSION_HANDOFF.md "Web builds"); this workflow is the
# manual backup. GitHub Pages was dropped on 2026-11-04 after its deploy
# step kept timing out. Needs the repository secret BUTLER_API_KEY.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web
  cancel-in-progress: true

env:
  ITCH_TARGET: light213/petri:html5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Tests
        run: godot --headless --path . -s res://tests/run_tests.gd

      - name: Stamp build info
        run: |
          echo "{\"sha\": \"${GITHUB_SHA::7}\", \"run\": ${GITHUB_RUN_NUMBER}, \"built\": \"$(date -u +%Y-%m-%dT%H:%MZ)\"}" > data/build_info.json

      - name: Export web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/web "$ITCH_TARGET" --userversion "${GITHUB_SHA::7}"
