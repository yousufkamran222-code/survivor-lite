name: Setup Godot
description: Install the Godot version pinned in GODOT_VERSION (cached), optionally with web + Android export templates, then import the project.
inputs:
  templates:
    description: "Also install export templates (web + android)"
    default: "false"
runs:
  using: composite
  steps:
    - id: v
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < GODOT_VERSION)" >> "$GITHUB_OUTPUT"

    - id: cache-bin
      uses: actions/cache@v4
      with:
        path: ~/godot-bin
        key: godot-bin-${{ steps.v.outputs.version }}

    - if: steps.cache-bin.outputs.cache-hit != 'true'
      shell: bash
      run: |
        V="${{ steps.v.outputs.version }}"
        mkdir -p ~/godot-bin
        curl -fsSL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot-bin
        mv ~/godot-bin/Godot_v${V}-stable_linux.x86_64 ~/godot-bin/godot
        chmod +x ~/godot-bin/godot

    - shell: bash
      run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

    - if: inputs.templates == 'true'
      id: cache-tpl
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-templates-${{ steps.v.outputs.version }}-web-android-v1

    - if: inputs.templates == 'true' && steps.cache-tpl.outputs.cache-hit != 'true'
      shell: bash
      run: |
        V="${{ steps.v.outputs.version }}"
        D="$HOME/.local/share/godot/export_templates/${V}.stable"
        mkdir -p "$D" /tmp/tpl
        curl -fsSL --retry 3 -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
        unzip -q /tmp/tpl.tpz "templates/web_nothreads_*" "templates/android_*" "templates/version.txt" -d /tmp/tpl
        mv /tmp/tpl/templates/* "$D/"
        rm -rf /tmp/tpl /tmp/tpl.tpz

    - name: Import project
      shell: bash
      run: |
        godot --headless --path . --import
        # A second pass resolves preloads of freshly imported assets.
        godot --headless --path . --import
